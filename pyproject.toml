[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verifiable-financial-agent-system"
version = "0.1.0"
description = "Evidence-gated, deterministic financial research runtime"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography>=46,<47",
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sse-starlette>=2.1,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.8,<1",
]
langfuse = ["langfuse>=3,<4"]
postgres = ["asyncpg>=0.30,<1"]
voice = ["livekit-api==1.2.1", "livekit==1.1.8", "livekit-agents==1.5.12",
         "livekit-plugins-silero==1.5.12", "av>=14,<17", "numpy>=2,<3",
         "opencc-python-reimplemented>=0.1.7,<0.2", "websockets>=15,<16",
         "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1", "psutil>=6,<8"]
speech = ["faster-whisper>=1.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src", "apps", "contracts", "installer"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
